# Generate the Xcode project with: brew install xcodegen && xcodegen
name: iosApp
options:
  bundleIdPrefix: com.posificator
  deploymentTarget:
    iOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  iosApp:
    type: application
    platform: iOS
    sources:
      - path: iosApp
    info:
      path: iosApp/Info.plist
      properties:
        CFBundleDisplayName: Posificator
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        CADisableMinimumFrameDurationOnPhone: true
        NSLocationWhenInUseUsageDescription: Posificator uses your location to fill in a place's coordinates and to tell you when you arrive.
        NSLocationAlwaysAndWhenInUseUsageDescription: Posificator needs location access all the time to notify you when you arrive at a saved place, even when the app is closed.
    settings:
      base:
        PRODUCT_NAME: Posificator
        PRODUCT_BUNDLE_IDENTIFIER: com.posificator.ios
        CODE_SIGN_STYLE: Automatic
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        FRAMEWORK_SEARCH_PATHS:
          - "$(inherited)"
          - "$(SRCROOT)/../composeApp/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-framework"
          - "ComposeApp"
          - "-framework"
          - "MapKit"
          - "-framework"
          - "CoreLocation"
          - "-framework"
          - "UserNotifications"
    preBuildScripts:
      - name: Compile Kotlin Framework
        basedOnDependencyAnalysis: false
        script: |
          if [ "YES" = "$OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED" ]; then
            echo "Skipping Gradle build task invocation due to OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED environment variable set to \"YES\""
            exit 0
          fi
          cd "$SRCROOT/.."
          ./gradlew :composeApp:embedAndSignAppleFrameworkForXcode
